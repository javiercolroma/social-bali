name: GymSwipeIOS
options:
  bundleIdPrefix: com.javiercolroma
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
targets:
  GymSwipeIOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: GymSwipeIOS
    dependencies:
      - sdk: HealthKit.framework
      - target: ForgeWidget
    entitlements:
      path: GymSwipeIOS/GymSwipeIOS.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: GymSwipeIOS/Info.plist
      properties:
        CFBundleDisplayName: Forge Loop
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSHealthShareUsageDescription: Forge Loop lee tu frecuencia cardíaca de la app Salud para registrarla en tus entrenamientos.
        NSLocationWhenInUseUsageDescription: Forge Loop usa tu ubicación para mostrarte el ranking y los compañeros de entreno cercanos.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIViewControllerBasedStatusBarAppearance: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.javiercolroma.gymswipeios
      PRODUCT_NAME: Forge Loop
      INFOPLIST_FILE: GymSwipeIOS/Info.plist
      SDKROOT: iphoneos
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      SUPPORTS_MACCATALYST: false
      SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: "1,2"
  ForgeWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: ForgeWidget
      - path: GymSwipeIOS/WorkoutActivityAttributes.swift
      - path: GymSwipeIOS/WorkoutRemote.swift
      - path: GymSwipeIOS/WorkoutIntents.swift
    info:
      path: ForgeWidget/Info.plist
      properties:
        CFBundleDisplayName: Forge Loop
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.javiercolroma.gymswipeios.widget
      PRODUCT_NAME: ForgeWidget
      SDKROOT: iphoneos
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      SUPPORTS_MACCATALYST: false
      TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  GymSwipeIOS:
    build:
      targets:
        GymSwipeIOS: all
    run:
      config: Debug
    archive:
      config: Release
