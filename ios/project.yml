name: GymSwipeIOS
options:
  # La app tiene UN solo idioma: inglés (club social internacional en Bali).
  # Las cadenas HISTÓRICAS siguen teniendo la clave en español: `en.lproj` (la única
  # localización) las mapea a inglés. Las cadenas nuevas se escriben en inglés.
  developmentLanguage: en
  bundleIdPrefix: com.javiercolroma
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "15"
  # Firma para iPhone físico (Personal Team del Apple ID añadido en Xcode).
  # Al vivir aquí, sobrevive a las regeneraciones de xcodegen.
  DEVELOPMENT_TEAM: 5JHD53WQ67
  CODE_SIGN_STYLE: Automatic
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.1.0"
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
targets:
  GymSwipeIOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: GymSwipeIOS
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: Supabase
        product: Supabase
    entitlements:
      path: GymSwipeIOS/GymSwipeIOS.entitlements
      properties:
        # Restaurado al pasar a la cuenta de developer DE PAGO (2026-07-27).
        com.apple.developer.applesignin:
          - Default
    info:
      path: GymSwipeIOS/Info.plist
      properties:
        CFBundleDisplayName: Bali Circle
        # Cableadas a los ajustes de arriba: si no, xcodegen las deja literales a "1"
        # y subir CURRENT_PROJECT_VERSION no cambia nada (Apple rechaza build duplicada).
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # Google Sign-In: sustituye GOOGLE_REVERSED_CLIENT_ID por tu "iOS URL scheme"
        # (el client ID al revés, empieza por com.googleusercontent.apps.…) y ejecuta
        # `npm run ios:generate`. El client ID va en AuthConfig.swift. Ver README.
        CFBundleURLTypes:
          # Deep link de invitaciones: balicircle://user/<usuario> abre ese perfil en la app.
          - CFBundleURLSchemes:
              - balicircle
        ITSAppUsesNonExemptEncryption: false
        # Abrir ubicaciones en Google Maps si está instalado.
        LSApplicationQueriesSchemes:
          - comgooglemaps
        NSPhotoLibraryUsageDescription: Bali Circle shows your recent photos so you can send them quickly in a chat.
        LSApplicationCategoryType: public.app-category.social-networking
        NSCameraUsageDescription: Bali Circle uses the camera when you send a photo or video in a chat.
        NSMicrophoneUsageDescription: Bali Circle uses the microphone to record voice messages.
        NSLocationWhenInUseUsageDescription: Bali Circle uses your location to show how far away people in your circle are. Others only see the distance, never where you are.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIViewControllerBasedStatusBarAppearance: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.javiercolroma.balicircle
        PRODUCT_NAME: Bali Circle
        INFOPLIST_FILE: GymSwipeIOS/Info.plist
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  GymSwipeIOS:
    build:
      targets:
        GymSwipeIOS: all
    run:
      config: Debug
    archive:
      config: Release
