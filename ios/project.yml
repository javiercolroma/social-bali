name: GymSwipeIOS
options:
  developmentLanguage: es   # las cadenas del código SON las claves; en.lproj traduce
  bundleIdPrefix: com.javiercolroma
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "2"
  # Firma para iPhone físico (Personal Team del Apple ID añadido en Xcode).
  # Al vivir aquí, sobrevive a las regeneraciones de xcodegen.
  DEVELOPMENT_TEAM: 5JHD53WQ67
  CODE_SIGN_STYLE: Automatic
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.1.0"
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
targets:
  GymSwipeIOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: GymSwipeIOS
    dependencies:
      - sdk: HealthKit.framework
      - target: ForgeWidget
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: Supabase
        product: Supabase
    entitlements:
      path: GymSwipeIOS/GymSwipeIOS.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Restaurado al pasar a la cuenta de developer DE PAGO (2026-07-27).
        com.apple.developer.applesignin:
          - Default
    info:
      path: GymSwipeIOS/Info.plist
      properties:
        CFBundleDisplayName: Forge Loop
        # Cableadas a los ajustes de arriba: si no, xcodegen las deja literales a "1"
        # y subir CURRENT_PROJECT_VERSION no cambia nada (Apple rechaza build duplicada).
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # Google Sign-In: sustituye GOOGLE_REVERSED_CLIENT_ID por tu "iOS URL scheme"
        # (el client ID al revés, empieza por com.googleusercontent.apps.…) y ejecuta
        # `npm run ios:generate`. El client ID va en AuthConfig.swift. Ver README.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.610266617536-rs1havs16kj8hmfcananppassb7v6ads
          # Deep link de invitaciones: forgeloop://user/<usuario> abre ese perfil en la app.
          - CFBundleURLSchemes:
              - forgeloop
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSHealthShareUsageDescription: Forge Loop lee tu frecuencia cardíaca de la app Salud para registrarla en tus entrenamientos.
        # Obligatoria por tener el entitlement de HealthKit, aunque la app NO escriba
        # en Salud (HealthManager pide `toShare: []`). Sin ella: rechazo ITMS-90683.
        NSHealthUpdateUsageDescription: Forge Loop no guarda datos en la app Salud; solo lee tu frecuencia cardíaca durante los entrenamientos.
        NSLocationWhenInUseUsageDescription: Forge Loop usa tu ubicación para mostrarte el ranking y los compañeros de entreno cercanos.
        NSCameraUsageDescription: Forge Loop usa la cámara para hacer la foto de tu entreno.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIViewControllerBasedStatusBarAppearance: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.javiercolroma.gymswipeios
      PRODUCT_NAME: Forge Loop
      INFOPLIST_FILE: GymSwipeIOS/Info.plist
      SDKROOT: iphoneos
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      SUPPORTS_MACCATALYST: false
      SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: "1,2"
  ForgeWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: ForgeWidget
      - path: GymSwipeIOS/WorkoutActivityAttributes.swift
      - path: GymSwipeIOS/WorkoutRemote.swift
      - path: GymSwipeIOS/WorkoutIntents.swift
      - path: GymSwipeIOS/LiveActivityManager.swift
    info:
      path: ForgeWidget/Info.plist
      properties:
        CFBundleDisplayName: Forge Loop
        # La extensión DEBE llevar la misma versión que la app o falla la subida.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.javiercolroma.gymswipeios.widget
      PRODUCT_NAME: ForgeWidget
      SDKROOT: iphoneos
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      SUPPORTS_MACCATALYST: false
      TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  GymSwipeIOS:
    build:
      targets:
        GymSwipeIOS: all
    run:
      config: Debug
    archive:
      config: Release
