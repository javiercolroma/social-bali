name: GymSwipeIOS
options:
  bundleIdPrefix: com.javiercolroma
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
targets:
  GymSwipeIOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: GymSwipeIOS
    info:
      path: GymSwipeIOS/Info.plist
      properties:
        CFBundleDisplayName: Forge Loop
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSLocationWhenInUseUsageDescription: Forge Loop usa tu ubicación para mostrarte el ranking y los compañeros de entreno cercanos.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIViewControllerBasedStatusBarAppearance: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.javiercolroma.gymswipeios
      PRODUCT_NAME: Forge Loop
      INFOPLIST_FILE: GymSwipeIOS/Info.plist
      SDKROOT: iphoneos
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      SUPPORTS_MACCATALYST: false
      SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  GymSwipeIOS:
    build:
      targets:
        GymSwipeIOS: all
    run:
      config: Debug
    archive:
      config: Release
